name: Reset HCU CI approval label

on:
  pull_request_target:
    branches: [r2.13-das]
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-label:
    name: Remove approval after a new PR revision
    runs-on: ubuntu-latest
    steps:
      # Only update PR metadata; never check out or execute PR code here.
      - name: Remove ready-hcu
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'ready-hcu'
              });
            } catch (error) {
              // A missing label needs no action; surface all other failures.
              if (error.status !== 404) throw error;
            }
